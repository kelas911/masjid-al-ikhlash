<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portal Masjid Al Ikhlash</title>
  <meta name="description" content="Jadwal sholat, kegiatan, struktur pengurus, laporan kas, dan infaq online Masjid Al Ikhlash.">
  <meta name="theme-color" content="#0B5D36">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Al Ikhlash">

  <!-- Percepat koneksi pertama ke backend & font -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="image" href="./assets/ikhlas.jpg" fetchpriority="high">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <a class="skip" href="#main">Lewati ke konten</a>

  <header class="top" id="top">
    <div class="top-in">
      <a class="brand" href="#/beranda" data-go="beranda" aria-label="Beranda">
        <img src="./assets/logo-muhammadiyah.webp" alt="" width="36" height="36">
        <span class="bt"><b id="hd-nama">Masjid Al Ikhlash</b><small id="hd-sub">Beranda</small></span>
      </a>
      <div class="top-act" id="hd-act"></div>
    </div>
    <div class="net" id="net" role="status" hidden>Tidak ada koneksi — menampilkan data tersimpan</div>
  </header>

  <main id="main" tabindex="-1">
    <section class="page" id="p-beranda" aria-label="Beranda"></section>
    <section class="page" id="p-kas" aria-label="Kas" hidden></section>
    <section class="page" id="p-donasi" aria-label="Donasi" hidden></section>
    <section class="page" id="p-kegiatan" aria-label="Kegiatan" hidden></section>
    <section class="page" id="p-pengurus" aria-label="Pengurus" hidden></section>
    <section class="page" id="p-admin" aria-label="Panel Takmir" hidden></section>
  </main>

  <nav class="bnav" id="bnav" aria-label="Menu utama">
    <a href="#/beranda" data-go="beranda"></a>
    <a href="#/kas" data-go="kas"></a>
    <a href="#/donasi" data-go="donasi"></a>
    <a href="#/kegiatan" data-go="kegiatan"></a>
    <a href="#/pengurus" data-go="pengurus"></a>
  </nav>

  <div class="overlay" id="overlay" hidden>
    <div class="scrim" data-act="close-scrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1">
      <span class="grab" aria-hidden="true"></span>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px;font-family:sans-serif">Aplikasi ini memerlukan JavaScript. Mohon aktifkan JavaScript di browser Anda.</p></noscript>

  <script src="./js/config.js"></script>
  <script src="./js/util.js"></script>
  <script src="./js/khgt.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/pages.js"></script>
  <script src="./js/admin.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
